services:
  db:
    image: postgres:16-alpine
    container_name: fitbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitbook
      POSTGRES_PASSWORD: fitbook123
      POSTGRES_DB: fitbook_db
    ports:
      - "5433:5432"
    volumes:
      - fitbook_data:/var/lib/postgresql/data

volumes:
  fitbook_data: